created: '2026-10-14'
versions:
  dsprep: 0.2.0
  pandas: 2.1.1
  numpy: 1.24.3
  scikit-learn: 1.3.0
eda_source: eda_clinvar.ipynb
user_overrides:
- key: recommendations.leakage
  eda_value:
  - column: CLNDN
    evidence: names collected per submission; 22% conflicting with 1 name vs 40% with
      4+ (AUC 0.57)
    verdict: check_with_user
  - column: CLNDISDB
    evidence: same information as CLNDN as database IDs
    verdict: check_with_user
  - column: CLNSIGINCL
    evidence: clinical-significance field; 167 rows, 41% conflicting vs 25%
    verdict: check_with_user
  - column: CLNVI
    evidence: external cross-references; 32% conflicting when present vs 20%
    verdict: keep
  user_value:
  - column: CLNDN
    evidence: user chose to keep
    verdict: keep
  - column: CLNDISDB
    evidence: user chose to keep
    verdict: keep
  - column: CLNSIGINCL
    evidence: user chose to keep
    verdict: keep
  - column: CLNVI
    evidence: user chose to keep
    verdict: keep
- key: validation.split
  eda_value: stratified
  user_value: group_stratified
- key: validation.stratify_on
  eda_value:
  - CLASS
  user_value:
  - CLASS
- key: open_questions
  eda_value:
  - 'When is a variant scored: on existing ClinVar records (keep CLNDN / CLNDISDB)
    or at first submission (drop them as leakage)?'
  - 'Keep CLNSIGINCL (167 rows, a clinical-significance field)? Default: drop.'
  - 'Primary validation: random stratified (variants in known genes) or grouped by
    gene (unseen genes)?'
  user_value: []
cleaning:
- step: parsing_fixes
  column: cDNA_position
  action: manual
  n_affected: null
  note: take the first integer of the text ('943-944' -> 943, '?-117' -> 117)
- step: parsing_fixes
  column: CDS_position
  action: manual
  n_affected: null
  note: take the first integer of the text ('943-944' -> 943, '?-117' -> 117)
- step: parsing_fixes
  column: Protein_position
  action: manual
  n_affected: null
  note: take the first integer of the text ('943-944' -> 943, '?-117' -> 117)
- step: parsing_fixes
  column: EXON
  action: manual
  n_affected: null
  note: split 'n/total' into EXON_num and EXON_total
- step: parsing_fixes
  column: INTRON
  action: manual
  n_affected: null
  note: split 'n/total' into INTRON_num and INTRON_total
- step: drop_columns
  column: POS
  action: dropped
  n_affected: null
  note: genomic coordinate, part of the key
- step: drop_columns
  column: CLNHGVS
  action: dropped
  n_affected: null
  note: unique identifier (key as a string)
- step: drop_columns
  column: Allele
  action: dropped
  n_affected: null
  note: same as ALT in VEP notation
- step: drop_columns
  column: Feature
  action: dropped
  n_affected: null
  note: transcript ID, one-to-one with SYMBOL for 98.4% of genes
- step: drop_columns
  column: Feature_type
  action: dropped
  n_affected: null
  note: near-constant (99.98% Transcript)
- step: drop_columns
  column: BIOTYPE
  action: dropped
  n_affected: null
  note: near-constant (99.95% protein_coding)
- step: drop_columns
  column: MOTIF_NAME
  action: dropped
  n_affected: null
  note: 100% missing
- step: drop_columns
  column: MOTIF_POS
  action: dropped
  n_affected: null
  note: 100% missing
- step: drop_columns
  column: HIGH_INF_POS
  action: dropped
  n_affected: null
  note: 100% missing
- step: drop_columns
  column: MOTIF_SCORE_CHANGE
  action: dropped
  n_affected: null
  note: 100% missing
- step: drop_columns
  column: DISTANCE
  action: dropped
  n_affected: null
  note: 99.8% missing
- step: drop_columns
  column: SSR
  action: dropped
  n_affected: null
  note: 99.8% missing, no target association (BH p 0.57)
- step: drop_columns
  column: CLNDISDBINCL
  action: dropped
  n_affected: null
  note: 99.7% missing
- step: drop_columns
  column: CLNDNINCL
  action: dropped
  n_affected: null
  note: 99.7% missing
- step: drop_columns
  column: CADD_RAW
  action: dropped
  n_affected: null
  note: Spearman 1.00 with CADD_PHRED
- step: drop_columns
  column: CDS_position
  action: dropped
  n_affected: null
  note: Pearson 1.00 with cDNA_position, which covers more rows
- step: drop_columns
  column: Protein_position
  action: dropped
  n_affected: null
  note: Pearson 1.00 with cDNA_position
target:
  task: binary
  mode: auto
  classes:
  - '0'
  - '1'
  positive_class: '1'
  log:
  - processor: TargetProcessor
    column: <target>
    action: binary_map
    detail: 0 -> 0, 1 -> 1
split:
  how: group_stratified
  sizes:
  - 0.7
  - 0.15
  - 0.15
  group_col: SYMBOL
  stratify_col: CLASS
  seed: 42
