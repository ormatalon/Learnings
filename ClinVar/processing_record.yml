notes:
- 'class_weights (balanced, train): {0.0: 0.6681104868395561, 1.0: 1.9871172209417187}'
- SYMBOL is the split group and not a feature
- gene_n_variants computed on the full frame before splitting (no target used)
- 'CV in the modeling step: refit build_feature_processor() per fold; folds grouped
